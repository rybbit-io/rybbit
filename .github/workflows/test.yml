name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned so a run never depends on the runner's default zone. The suites are
# timezone-independent (verified across UTC, US, EU, IN and NZ zones); this keeps
# an accidental system-zone dependency from passing here and failing elsewhere.
env:
  TZ: UTC

jobs:
  docs:
    name: Docs and agent HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Lint integration guides
        working-directory: docs
        run: npm run lint:guides

      - name: Run agent-readiness tests
        working-directory: docs
        run: npm run test:agent-readiness

      - name: Build docs
        working-directory: docs
        run: npm run build

      - name: Verify production HTTP behavior
        working-directory: docs
        run: npm run test:agent-http

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install server dependencies
        run: pnpm --filter rybbit-backend... install --frozen-lockfile

      - name: Build server and shared
        run: pnpm build:server

      - name: Run server tests
        run: pnpm --filter rybbit-backend test:run

  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm --filter client... install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @rybbit/shared build

      - name: Run client tests
        run: pnpm --filter client test:run

      - name: Build client
        run: pnpm --filter client build
